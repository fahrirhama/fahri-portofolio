<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak | Portofolio Fahri Rhama Dony</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Fahri Rhama Dony</a>
      <button class="navbar-toggler border-0" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu"
              aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link active" href="kontak.html">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="fw-bold mb-4">Hubungi Saya</h1>

    <div class="row g-4">
      <!-- Form -->
      <div class="col-lg-7">
        <section class="card card-custom h-100">
          <div class="card-body p-4">
            <form action="#" method="post">
              <div class="mb-3">
                <label for="nama" class="form-label fw-semibold">Nama</label>
                <input type="text" class="form-control" id="nama" name="nama"
                       placeholder="Nama lengkap" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="nama@email.com" required>
              </div>
              <div class="mb-3">
                <label for="pesan" class="form-label fw-semibold">Pesan</label>
                <textarea class="form-control" id="pesan" name="pesan" rows="5"
                          placeholder="Tulis pesan kamu..."></textarea>
              </div>
              <button type="submit" class="btn btn-accent">
                <i class="bi bi-send-fill me-2"></i>Kirim Pesan
              </button>
            </form>
          </div>
        </section>
      </div>

      <!-- Media Sosial -->
      <div class="col-lg-5">
        <section class="card card-custom h-100">
          <div class="card-body p-4">
            <h2 class="h4 fw-bold mb-3">Media Sosial</h2>
            <div class="d-flex flex-column gap-2">
              <a href="https://github.com" target="_blank"
                 class="btn btn-outline-success d-flex align-items-center gap-2">
                <i class="bi bi-github"></i> GitHub
              </a>
              <a href="https://instagram.com" target="_blank"
                 class="btn btn-outline-success d-flex align-items-center gap-2">
                <i class="bi bi-instagram"></i> Instagram
              </a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-white-50 border-top border-secondary-subtle">
    <p class="mb-0">&copy; 2026 Fahri Rhama Dony. Dibuat dengan HTML &amp; CSS.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
